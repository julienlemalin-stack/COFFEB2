<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Manoverde</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0710;
    --bg-soft:#171022;
    --card:#1D1428;
    --ink:#F5F0FF;
    --ink-soft:#A99BC2;
    --line:#33254A;
    --pink:#FF2E9A;
    --purple:#9B3CFF;
    --cyan:#2FE0FF;
    --lime:#5CFF7A;
    --amber:#FFB020;
    --radius:18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  body{ padding-bottom:96px; }
  ::selection{ background:var(--pink); color:#0B0710; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }
  .hidden{ display:none !important; }

  /* ---------- Header ---------- */
  header{
    padding:22px 20px 18px;
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(circle at 10% -20%, rgba(155,60,255,0.45), transparent 55%),
      radial-gradient(circle at 100% -10%, rgba(47,224,255,0.25), transparent 50%),
      var(--bg);
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--cyan);
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow::before{
    content:'';
    width:6px; height:6px;
    background:var(--pink);
    border-radius:50%;
    display:inline-block;
    box-shadow:0 0 8px var(--pink);
  }
  h1.logo{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:42px;
    line-height:1;
    margin-top:8px;
    color:var(--lime);
    text-shadow:
      0 0 14px rgba(92,255,122,0.55),
      2px 3px 0 rgba(11,7,16,0.6);
  }
  .tagline{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:8px;
    max-width:36ch;
  }

  /* ---------- Views ---------- */
  .view{ padding-bottom:10px; }

  /* ---------- Home: category banners ---------- */
  .banners{
    display:flex;
    flex-direction:column;
    gap:14px;
    padding:18px 20px 8px;
  }
  .banner{
    position:relative;
    border-radius:var(--radius);
    overflow:hidden;
    height:118px;
    display:flex;
    align-items:flex-end;
    padding:14px 16px;
    cursor:pointer;
    border:1.5px solid rgba(255,255,255,0.06);
  }
  .banner:active{ transform:scale(0.98); }
  .banner .glow{
    position:absolute; inset:0;
    opacity:0.9;
  }
  .banner .photo{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    object-position:center;
  }
  .banner .shade{
    position:absolute; inset:0;
    background:linear-gradient(0deg, rgba(0,0,0,0.65), rgba(0,0,0,0.15) 55%, rgba(0,0,0,0.35));
  }
  .banner .icon{
    position:absolute;
    top:12px; right:14px;
    font-size:30px;
    opacity:0.5;
    filter:drop-shadow(0 0 10px rgba(255,255,255,0.25));
  }
  .banner .label{
    position:relative;
    z-index:1;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:24px;
    letter-spacing:0.01em;
    text-shadow:2px 3px 0 rgba(0,0,0,0.35);
  }
  .banner .sub{
    position:relative;
    z-index:1;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:rgba(255,255,255,0.75);
    margin-top:2px;
  }

  /* ---------- Category header bar ---------- */
  .cat-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:18px 20px 4px;
    padding:12px 16px;
    border-radius:14px;
    background:linear-gradient(100deg, var(--card), rgba(255,255,255,0.02));
    border:1.5px solid var(--line);
  }
  .cat-bar .back{
    background:none; border:none;
    color:var(--cyan);
    font-size:18px;
    cursor:pointer;
  }
  .cat-bar .cat-name{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:16px;
  }

  /* ---------- Product grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    padding:14px 20px 20px;
  }
  .card{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    position:relative;
    overflow:hidden;
    cursor:pointer;
    opacity:0;
    transform:translateY(10px);
    animation:rise 0.4s ease forwards;
  }
  @keyframes rise{ to{ opacity:1; transform:translateY(0);} }
  .card:active{ transform:scale(0.97); }

  .card-media{
    width:100%;
    aspect-ratio:1/0.9;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    position:relative;
    overflow:hidden;
  }
  .card-media img{ width:100%; height:100%; object-fit:cover; display:block; }
  .cbd-badge{
    position:absolute;
    top:8px; left:8px;
    background:rgba(11,7,16,0.75);
    border-radius:20px;
    padding:3px 8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    font-weight:600;
    color:var(--lime);
  }
  .card-body{ padding:11px 12px 13px; }
  .card-name{ font-size:13px; font-weight:700; line-height:1.25; margin-bottom:5px; }
  .card-farm{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; color:var(--ink-soft); margin-bottom:8px; }
  .price-from{ font-family:'IBM Plex Mono', monospace; font-size:9px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em; display:block; }
  .price{ font-family:'IBM Plex Mono', monospace; font-size:14px; font-weight:700; }

  /* ---------- Static sections (Info / Links / Avis) ---------- */
  .static-section{ padding:22px 20px 10px; }
  .static-section h2{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:20px;
    margin-bottom:10px;
    color:var(--lime);
  }
  .static-section p{ font-size:13px; color:var(--ink-soft); line-height:1.6; margin-bottom:14px; }
  .link-btn{
    display:block;
    padding:14px 16px;
    border-radius:14px;
    background:linear-gradient(100deg, var(--purple), var(--pink));
    color:#fff;
    font-weight:700;
    font-size:13px;
    text-decoration:none;
    margin-bottom:10px;
  }
  .review{
    padding:12px 14px;
    border-radius:14px;
    background:var(--card);
    border:1.5px solid var(--line);
    margin-bottom:10px;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .review .stars{ color:var(--amber); font-size:13px; margin-bottom:4px; }

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:fixed;
    left:14px; right:14px; bottom:14px;
    display:flex;
    justify-content:space-between;
    gap:8px;
    background:var(--bg-soft);
    border-radius:24px;
    padding:8px;
    border:1.5px solid var(--pink);
    box-shadow:0 0 18px rgba(255,46,154,0.25);
    z-index:15;
  }
  .navbtn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    padding:8px 0;
    border-radius:16px;
    background:none;
    border:none;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:0.03em;
    cursor:pointer;
  }
  .navbtn .ic{ font-size:17px; }
  .navbtn.active{
    background:rgba(255,46,154,0.14);
    color:var(--pink);
  }

  /* ---------- Cart bar ---------- */
  .cartbar{
    position:fixed;
    left:14px; right:14px; bottom:78px;
    background:linear-gradient(100deg, #7C2AE8, #C24DFF 50%, #FF2E9A);
    color:#fff;
    border-radius:26px;
    padding:11px 8px 11px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 10px 24px rgba(124,42,232,0.4);
    transform:translateY(160%);
    transition:transform 0.3s cubic-bezier(.22,1,.36,1);
    z-index:20;
  }
  .cartbar.show{ transform:translateY(0); }
  .cartbar .info{ display:flex; flex-direction:column; font-family:'IBM Plex Mono', monospace; }
  .cartbar .info .count{ font-size:10px; color:#EFE0FF; letter-spacing:0.06em; text-transform:uppercase;}
  .cartbar .info .total{ font-size:16px; font-weight:700; }
  .cartbar .view{
    background:var(--lime);
    color:#0B0710;
    border:none;
    border-radius:20px;
    padding:10px 18px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.03em;
    text-transform:uppercase;
    cursor:pointer;
  }

  /* ---------- Overlay + sheets ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(6,4,10,0.65);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
    z-index:30;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    max-height:86vh;
    background:var(--bg-soft);
    border-top:1.5px solid var(--line);
    border-radius:22px 22px 0 0;
    transform:translateY(100%);
    transition:transform 0.32s cubic-bezier(.22,1,.36,1);
    z-index:31;
    display:flex;
    flex-direction:column;
  }
  .sheet.show{ transform:translateY(0); }
  .sheet-handle{ width:36px; height:4px; background:var(--line); border-radius:4px; margin:10px auto 6px; flex:0 0 auto; }
  .sheet-scroll{ overflow-y:auto; }

  #productMedia{
    width:100%;
    aspect-ratio:1/0.75;
    display:flex; align-items:center; justify-content:center;
    font-size:60px;
  }
  #productMedia img{ width:100%; height:100%; object-fit:cover; }
  .product-info{ padding:16px 20px 4px; }
  .product-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .product-head h2{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:19px; line-height:1.25; }
  .close-x{ background:none; bo
